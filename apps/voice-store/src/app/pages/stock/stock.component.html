<div class="container grid px-2 mx-auto">
    <h2 class="my-6 text-2xl font-semibold text-gray-700 dark:text-gray-200">
        Almacen
    </h2>
    <div class="w-full mb-8 overflow-hidden rounded-lg shadow-xs">
        <div class="w-full overflow-x-auto">
            <table class="w-full whitespace-no-wrap">
                <thead>
                    <tr class="text-xs font-semibold tracking-wide text-left text-gray-500 uppercase border-b dark:border-gray-700 bg-gray-50 dark:text-gray-400 dark:bg-gray-800">
                        <th class="px-2 py-3">Producto</th>
                        <th class="px-2 py-3 text-center">Amount</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y dark:divide-gray-700 dark:bg-gray-800">
                    @for (item of currentItems(); track item.id) {
                        <tr class="text-gray-700 dark:text-gray-400">
                            <td class="px-2 py-3">
                                <div class="flex items-center text-sm">
                                    <!-- Avatar with inset shadow -->
                                    <div class="relative w-8  h-8 mr-3 rounded block">
                                        <img class="object-cover w-full h-full rounded "                                            
                                            [src]="item.imageUrl$ | async"
                                            alt="" loading="lazy">
                                    </div>
                                    <div>
                                        <p class="font-semibold max-w-56 md:max-w-none  truncate">{{item.name}}</p>
                                        <p class="text-xs text-gray-600 dark:text-gray-400">
                                            {{item.description}}
                                        </p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-2 py-3 text-sm text-center">
                                {{item.amount}}
                            </td>                      
                        </tr>
    
                    }
                    
                </tbody>
            </table>
        </div>
        <div
            class="grid px-4 py-3 text-xs font-semibold tracking-wide text-gray-500 uppercase border-t dark:border-gray-700 bg-gray-50 sm:grid-cols-9 dark:text-gray-400 dark:bg-gray-800">
            <span class="flex items-center col-span-3">
                Mostrando {{start()}}-{{end()}} of {{pager().items}}
            </span>
            <span class="col-span-2"></span>
            <!-- Pagination -->
            <span class="flex col-span-4 mt-2 sm:mt-auto sm:justify-end">
                <nav aria-label="Table navigation">
                    <ul class="inline-flex items-center">
                        <li>
                            <button
                                [disabled]="!hasPrevious()"
                                (click)="changePage(currentPage() - 1)"
                                class="px-3 py-1 rounded-md rounded-l-lg focus:outline-none focus:shadow-outline-purple"
                                aria-label="Previous">
                                <svg aria-hidden="true" class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                                    <path
                                        d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                                        clip-rule="evenodd" fill-rule="evenodd"></path>
                                </svg>
                            </button>
                        </li>

                        @for (item of itemPages(); track $index) {
                            <li>
                                <button 
                                    (click)="changePage(item)"
                                    [ngClass]="{'text-white transition-colors duration-150 bg-purple-600 border border-r-0 border-purple-600': item === currentPage()}"    
                                    class="px-3 py-1 rounded-md focus:outline-none focus:shadow-outline-purple">
                                    {{item}}
                                </button>
                            </li>
                        }
                       
                        <li>
                            <span class="px-3 py-1">...</span>
                        </li>
                       
                        <li>
                            <button
                                [disabled]="!hasNext()"
                                class="px-3 py-1 rounded-md rounded-r-lg focus:outline-none focus:shadow-outline-purple"
                                (click)="changePage(currentPage() + 1)"
                                aria-label="Next">
                                <svg class="w-4 h-4 fill-current" aria-hidden="true" viewBox="0 0 20 20">
                                    <path
                                        d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                                        clip-rule="evenodd" fill-rule="evenodd"></path>
                                </svg>
                            </button>
                        </li>
                    </ul>
                </nav>
            </span>
        </div>
    </div>
</div>
